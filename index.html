<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>운전 연습 시뮬레이터</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1014; }
      canvas { display: block; }

      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d7dde3;
        background: rgba(10, 13, 17, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 10px 14px;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #hud b { color: #8fd0ff; font-weight: 600; }

      #help {
        position: fixed;
        right: 16px;
        bottom: 16px;
        font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8b96a1;
        text-align: right;
        pointer-events: none;
        user-select: none;
      }

      #lesson {
        position: fixed;
        left: 50%;
        bottom: 72px;
        transform: translateX(-50%);
        min-width: 380px;
        max-width: 560px;
        font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e6ebf0;
        background: rgba(12, 16, 21, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-left-width: 4px;
        border-radius: 8px;
        padding: 12px 16px;
        pointer-events: none;
        user-select: none;
        opacity: 0;
        transition: opacity 0.25s;
      }
      #lesson.show { opacity: 1; }
      #lesson.safe { border-left-color: #4ec98a; }
      #lesson.risky { border-left-color: #ffd166; }
      #lesson.dangerous { border-left-color: #ff8c42; }
      #lesson.collision { border-left-color: #ff5c5c; }
      #lesson .verdict { font-size: 15px; font-weight: 700; }
      #lesson .check { color: #98a3ae; }
      #lesson .ok { color: #4ec98a; }
      #lesson .no { color: #ff8c8c; }

      #signals {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        gap: 90px;
        font-size: 26px;
        color: #2b3138;
        pointer-events: none;
        user-select: none;
      }
      #signals .on { color: #4ec98a; }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8b96a1;
        background: #0d1014;
      }
      #boot.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">물리 엔진을 불러오는 중…</div>
    <div id="hud"></div>
    <div id="lesson"></div>
    <div id="signals"><span id="sig-left">◀</span><span id="sig-right">▶</span></div>
    <div id="help">
      W / S · 가속 / 제동 (정지 중 유지 → 기어 전환)<br />
      A / D · 핸들 &nbsp;·&nbsp; Space · 핸들에서 손 떼기<br />
      화면 클릭 · 마우스 조향 (Esc 로 해제)<br />
      Z / X · 좌 / 우 방향지시등 &nbsp;·&nbsp; Q / E · 어깨 너머 보기<br />
      1 / 2 · 공터 / 도로 &nbsp;·&nbsp; C · 시점 &nbsp;·&nbsp; R · 리스폰
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
