<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>운전 연습 시뮬레이터</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1014; }
      canvas { display: block; }

      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d7dde3;
        background: rgba(10, 13, 17, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 10px 14px;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #hud b { color: #8fd0ff; font-weight: 600; }

      #help {
        position: fixed;
        right: 16px;
        bottom: 16px;
        font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8b96a1;
        text-align: right;
        pointer-events: none;
        user-select: none;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8b96a1;
        background: #0d1014;
      }
      #boot.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">물리 엔진을 불러오는 중…</div>
    <div id="hud"></div>
    <div id="help">
      W / S · 가속 / 제동<br />
      A / D · 조향<br />
      C · 시점 전환 &nbsp; R · 리스폰
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
